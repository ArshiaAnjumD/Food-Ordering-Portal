
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: food-ordering
  template:
    metadata:
      labels:
        app: food-ordering
    spec:
      containers:
        - name: food-ordering
          image: arshiaanjumd/food-ordering-portal:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-service
spec:
  type: NodePort
  selector:
    app: food-ordering
  ports:
    - port: 80
      targetPort: 80
